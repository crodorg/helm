# cargo-deny config for helm. Run via `sh scripts/qa.sh audit` (or `cargo deny check`).
# helm has a deliberately small dependency tree (system ssh/tmux/curl are shelled out,
# not linked — see decisions.md 2026-05-17), so this stays tight: a permissive license
# allowlist enumerated from the actual tree and NO advisory ignores (cargo audit is
# clean as of the W3 hardening pass). The point is that `cargo deny check` fails CI only
# on a NEW advisory, license, or unvetted source — not on the known-good set.

[graph]
all-features = false
no-default-features = false

[advisories]
# No ignores: helm's tree carries no known advisories. Add an entry here (with a
# one-line rationale) only when an unfixable transitive advisory appears.
ignore = []

[licenses]
# Permissive set actually present in helm's tree (deps + dev-deps). Re-enumerate
# whenever the dep set changes; `cargo deny check licenses` reports any newcomer.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "Unicode-3.0",
    "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
# helm's tree is small; flag (don't fail on) duplicate versions so they stay visible.
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
