# Copy to config.toml and edit. config.toml is gitignored.
#
# When the TUI exits, helm auto-spawns `helm daemon` in the background so
# external `helm exec` calls still reach the control socket. Set to false
# to keep your machine free of background daemons.
# auto_daemon = true
#
# Flags inserted after `tmux` on every tmux call helm makes (the ssh'd
# remote scripts AND the local attach). Defaults to ["-u"] when unset —
# forces UTF-8 so box-drawing / unicode render even when the remote locale
# doesn't advertise it. Set to [] to disable, or list your own.
# tmux_flags = ["-u"]
#
# Optional side panes — all default to OFF. Flip a flag on only when you
# wire up its backing dependency (VULTR_API_KEY, the printing-press money
# CLIs, a working DNS resolver chain, etc.). Disabled panes don't show up
# in the Browse keys palette or the help overlay.
[features]
health = false      # `H` — HTTPS reachability + TLS expiry per business
vultr  = false      # `v` — Vultr instance overlay (needs $VULTR_API_KEY)
dns    = false      # `d` — per-business A/AAAA/MX/CAA table
money  = false      # `m` — Stripe + Mercury balances via printing-press CLIs

#
# Hosts: each VPS or local server you want to manage.
# `ssh_alias` must resolve via your ~/.ssh/config so ssh-agent + ProxyJump work
# without helm caring about the details.
#
# `hostname`, `user`, and `provider` are OPTIONAL — helm reads ~/.ssh/config at
# startup and backfills hostname/user from the matching Host block. Add a TOML
# entry only when you want to override the auto-discovered name/provider or
# attach businesses/notes to a host.

[[hosts]]
name = "router"
ssh_alias = "router"          # entry in ~/.ssh/config
provider = "local"            # local | vultr | buyvm | unknown — labels only; no API integration for buyvm
os = "openbsd"                # openbsd | linux | macos — drives the Services pane
hostname = "192.168.1.1"
user = "admin"
notes = "OpenBSD edge router"

[[hosts]]
name = "web"
ssh_alias = "web"
provider = "vultr"
os = "openbsd"
hostname = "web.example.org"
user = "admin"
notes = "OpenBSD application host"

# A systemd-based Linux VPS (Debian, Ubuntu, RHEL, Arch, etc.). The
# Services pane shells out to `systemctl list-units --type=service --all`
# and parses unit state. `os = "linux"` covers any systemd distro;
# non-systemd Linux (runit / OpenRC / s6) isn't recognized yet.
[[hosts]]
name = "linux-app"
ssh_alias = "linux-app"
provider = "vultr"
os = "linux"
hostname = "linux-app.example.org"
user = "deploy"
notes = "Linux (systemd) application host"

# A macOS host — the Services pane uses `launchctl list` (user-domain
# services only). Useful for laptops you also drive through helm.
[[hosts]]
name = "mac"
ssh_alias = "mac"
provider = "local"
os = "macos"
hostname = "mac.lan"
user = "you"
notes = "macOS workstation"

# Businesses — "business" here is just helm's noun for *any named thing
# with a domain*. Personal site, side project, brochureware, OSS
# landing page, your blog — anything you want the health pane (`H`) to
# probe and the Browse detail panel to show. The naming is historical
# (helm grew up managing a few revenue-generating sites); nothing in
# the code requires a business to make money. Skip stripe/mercury/
# postmark fields if it doesn't.
#
# Each entry maps a domain to the host(s) it runs on; helm uses this
# to render per-business overlays and (when the health flag is on)
# probe HTTPS reachability + TLS NotAfter for `primary_domain`.

[[businesses]]
name = "example.org"
primary_domain = "example.org"
host = "web"
repo_path = "/home/admin/sites/example"
deploy_cmd = "doas rcctl restart httpd"
notes = "Marketing site"
# Optional money linkage. When set, the Browse detail panel pulls this
# business's slice from the money cache and renders it inline under the
# business bullet. Helm fires the money fetch eagerly on startup when any
# business has either field populated.
#   stripe_account_id  Stripe Connect connected-account id (acct_…). Per-
#                      account balance fetch is a follow-up — for now the
#                      panel just labels the business as Stripe-linked and
#                      shows the fleet-wide available balance.
#   mercury_account_id Mercury account id from `mercury-pp-cli accounts`.
#                      The matching account's available + current balance
#                      renders inline.
# stripe_account_id = "acct_1NxxxYYY"
# mercury_account_id = "abc-123-mercury-uuid"
# postmark_server_token = "your-postmark-server-token"
#   ↑ when set, helm fires `curl` against Postmark's /stats/outbound on
#     startup and renders sent / bounced / spam counts for the last 30 days
#     inline under the business bullet. Token rides in
#     X-Postmark-Server-Token via curl's `-H @-` (never on argv).
#     config.toml is gitignored — but for portfolios prefer leaving the
#     field unset entirely.

# SSH config auto-discovery. Defaults: enabled, ~/.ssh/config, no ignore list.
# Aliases listed in `ignore` are dropped from the merged host list (useful for
# noise like alternate-user aliases — e.g. `router-git` for gitolite).

[ssh_config]
enabled = true
# path = "/custom/path/to/ssh_config"
ignore = ["router-git"]

# Per-alias OS overrides for hosts discovered in ~/.ssh/config. Without
# these, synthesized hosts default to `openbsd` and the Services pane (`s`)
# would call `rcctl ls` against a mac/linux box and fail. Map non-OpenBSD
# aliases to their actual init system. Explicit `[[hosts]].os` always wins
# over this map.
[ssh_config.os]
mac = "macos"
linux-vps = "linux"

# Shortcuts — quick-fire remote commands. Press `a` from Browse to open the
# palette filtered to the selected host, then the shortcut's single-char key.
# Commands run through the Runner, so `doas` prompts still surface the
# password modal. Omit `hosts` (or pass an empty list) to apply everywhere.

[[shortcuts]]
key = "H"
label = "restart httpd"
cmd = "doas rcctl restart httpd"
hosts = ["web"]

[[shortcuts]]
key = "u"
label = "uptime + load"
cmd = "uptime && w -h | wc -l"

# Logs — `l` from Browse opens a picker filtered to the selected host, then
# the log's single-char key streams `ssh -tt <alias> tail -n 200 -F <path>`.
# Esc kills the tail. Built-in defaults (m=messages, d=daemon, a=authlog) are
# always available; custom entries here add to them (and override on key
# collision for matching hosts). Omit `hosts` to apply to every host.

[[logs]]
key = "H"
label = "httpd access"
path = "/var/log/httpd/access.log"
hosts = ["web"]

[[logs]]
key = "E"
label = "httpd error"
path = "/var/log/httpd/error.log"
hosts = ["web"]

# Vultr API overlay: helm reads `VULTR_API_KEY` from the environment.
# Never put the key in this file — config.toml is gitignored but env-only
# eliminates the risk of an accidental leak. If the var is unset, the
# `v` pane shows `(set $VULTR_API_KEY to enable)` and the Browse detail
# pane omits the Vultr lines. Example: `export VULTR_API_KEY=vultr_...`

# Money overlay (`m` from Browse): helm shells out to two existing CLIs:
#   stripe-pp-cli balance   — needs STRIPE_SECRET_KEY (or `stripe-pp-cli auth set-token`)
#   mercury-pp-cli accounts — needs MERCURY_BEARER_AUTH (or `mercury-pp-cli auth set-token`)
# Both CLIs handle their own auth — helm never reads the tokens. If either
# CLI is missing or unauthenticated, the corresponding panel renders the
# CLI's error message. There is intentionally no `[stripe]` or `[mercury]`
# section in this file: tokens stay env-only by design.
