# Copy to config.toml and edit. config.toml is gitignored.
#
# Flags inserted after `tmux` on every tmux call helm makes (the ssh'd
# remote scripts AND the local attach). Defaults to ["-u"] when unset —
# forces UTF-8 so box-drawing / unicode render even when the remote locale
# doesn't advertise it. Set to [] to disable, or list your own.
# tmux_flags = ["-u"]

#
# Hosts: each VPS or local server you want to manage.
# `ssh_alias` must resolve via your ~/.ssh/config so ssh-agent + ProxyJump work
# without helm caring about the details.
#
# `hostname`, `user`, and `provider` are OPTIONAL — helm reads ~/.ssh/config at
# startup and backfills hostname/user from the matching Host block. Add a TOML
# entry only when you want to override the auto-discovered name/provider or
# attach businesses/notes to a host.

[[hosts]]
name = "relay"
ssh_alias = "relay"           # entry in ~/.ssh/config
provider = "local"            # local | vultr | buyvm | unknown — labels only; no API integration for buyvm
os = "openbsd"                # openbsd | linux | macos — selects the service backend (helm svc)
hostname = "192.168.1.1"
user = "admin"
notes = "OpenBSD edge gateway"

[[hosts]]
name = "web"
ssh_alias = "web"
provider = "vultr"
os = "openbsd"
hostname = "web.example.org"
user = "admin"
mosh = "auto"                 # interactive attach transport: auto (default) |
                             # on | off — also accepts true/false. `auto`
                             # detects remote mosh-server (cached 7d) and uses
                             # it, else ssh. Only `helm open` / `shell open`
                             # use it; send/read/exec stay on ssh.
notes = "OpenBSD application host"

# A systemd-based Linux VPS (Debian, Ubuntu, RHEL, Arch, etc.). On these,
# `helm svc` shells out to `systemctl list-units --type=service --all`
# and parses unit state. `os = "linux"` covers any systemd distro;
# non-systemd Linux (runit / OpenRC / s6) isn't recognized yet.
[[hosts]]
name = "linux-app"
ssh_alias = "linux-app"
provider = "vultr"
os = "linux"
hostname = "linux-app.example.org"
user = "deploy"
notes = "Linux (systemd) application host"

# A macOS host — `helm svc` uses `launchctl list` (user-domain services
# only). Useful for laptops you also drive through helm.
[[hosts]]
name = "laptop"
ssh_alias = "laptop"
provider = "local"
os = "macos"
hostname = "laptop.lan"
user = "you"
notes = "macOS workstation"

# Businesses — "business" here is just helm's noun for *any named thing
# with a domain*. Personal site, side project, brochureware, OSS landing
# page, your blog. The naming is historical (helm grew up managing a few
# revenue-generating sites); nothing in the code requires a business to
# make money. Each entry maps a domain to the host it runs on; `helm show
# <host>` lists the businesses linked to that host. Skip the stripe/
# mercury/postmark fields if you don't need them.

[[businesses]]
name = "example.org"
primary_domain = "example.org"
host = "web"
repo_path = "/home/admin/sites/example"
deploy_cmd = "doas rcctl restart httpd"
notes = "Marketing site"
# Optional account linkage — when set, `helm show <host>` flags the business
# as Stripe- / Mercury-linked (an informational badge; helm reads no balances).
#   stripe_account_id   Stripe Connect connected-account id (acct_…)
#   mercury_account_id  Mercury account id
#   postmark_server_token  surfaced as `postmark_linked` in `helm show --json`;
#                          config.toml is gitignored, but for portfolios prefer
#                          leaving it unset.
# stripe_account_id = "acct_1NxxxYYY"
# mercury_account_id = "abc-123-mercury-uuid"
# postmark_server_token = "your-postmark-server-token"

# SSH config auto-discovery. Defaults: enabled, ~/.ssh/config, no ignore list.
# Aliases listed in `ignore` are dropped from the merged host list (useful for
# noise like alternate-user aliases — e.g. `relay-git` for gitolite).

[ssh_config]
enabled = true
# path = "/custom/path/to/ssh_config"
ignore = ["relay-git"]

# Per-alias OS overrides for hosts discovered in ~/.ssh/config. Without
# these, synthesized hosts default to `openbsd` and `helm svc` would call
# `rcctl ls` against a macOS/Linux box and fail. Map non-OpenBSD aliases to
# their actual init system. Explicit `[[hosts]].os` always wins over this map.
[ssh_config.os]
laptop = "macos"
linux-vps = "linux"

# Shortcuts — named quick-fire remote commands, run with `helm run <key>
# <host> --yes` (operator-only; refuses without --yes). A `doas`/sudo password
# can't be answered over the non-interactive `run` path — use `helm shell` for
# those. Omit `hosts` (or pass an empty list) to apply everywhere.

[[shortcuts]]
key = "H"
label = "restart httpd"
cmd = "doas rcctl restart httpd"
hosts = ["web"]

[[shortcuts]]
key = "u"
label = "uptime + load"
cmd = "uptime && w -h | wc -l"

# Logs — `helm logs <host>` lists what's available; `helm logs <host> <key>`
# tails one (`-f` streams `tail -F`, `-n N` sets the line count). Built-in
# defaults (m=messages, d=daemon, a=authlog) are always available; custom
# entries here add to them (and override on key collision for matching hosts).
# Omit `hosts` to apply to every host.

[[logs]]
key = "H"
label = "httpd access"
path = "/var/log/httpd/access.log"
hosts = ["web"]

[[logs]]
key = "E"
label = "httpd error"
path = "/var/log/httpd/error.log"
hosts = ["web"]

# Vultr overlay: `helm vultr` reads `VULTR_API_KEY` from the environment.
# Never put the key in this file — config.toml is gitignored, but env-only
# eliminates the risk of an accidental leak. If the var is unset, `helm vultr`
# errors with `VULTR_API_KEY not set`. Example: `export VULTR_API_KEY=vultr_...`
