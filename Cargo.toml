[package]
name = "helm"
version = "0.4.2"
edition = "2024"
description = "Shared-shell etiquette for AI agents + a CLI for the fleet they live on"
license = "MIT"

[lib]
name = "helm"
path = "src/lib.rs"

[[bin]]
name = "helm"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
directories = "5"
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4.6.1", default-features = false, features = ["derive", "std", "help", "usage", "error-context", "suggestions"] }

[dev-dependencies]
tempfile = "3"
proptest = "1"

[profile.release]
lto = "thin"
strip = true
