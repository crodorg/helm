# helm demo config — used by docs/demo.tape only.
#
# This file is copied to a temp directory and renamed `config.toml` before
# vhs runs `helm`. Real configs (with personal hostnames / IPs) never go
# anywhere near the recording.

[[hosts]]
name = "web"
ssh_alias = "web"
provider = "vultr"
hostname = "web.example.com"
user = "admin"
notes = "OpenBSD application host"

[[hosts]]
name = "db"
ssh_alias = "db"
provider = "vultr"
hostname = "db.example.com"
user = "admin"
notes = "OpenBSD database host"

[[hosts]]
name = "relay"
ssh_alias = "relay"
provider = "local"
hostname = "192.0.2.1"
user = "admin"
notes = "OpenBSD edge gateway"

# A business links a domain to the host it runs on; `helm show <host>` lists them.
[[businesses]]
name = "example.org"
primary_domain = "example.org"
host = "web"
notes = "Marketing site"

[ssh_config]
enabled = false
